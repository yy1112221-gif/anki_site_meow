<style>
:root{

  --display:"Zen Kaku Gothic New", "IBM Plex Sans JP", system-ui, sans-serif;

  --mono:"DM Mono", ui-monospace, "SFMono-Regular", monospace;
  color-scheme: light;
}

    --accent:#8FC3B5; --accent-soft:#233A3C; --on-accent:#14172B; --cream:#3B3524;
    --rust:#E07A55; --ochre:#E2B45A;
    --good:#8FC3B5; --good-soft:#1E3533; --bad:#E07A55; --bad-soft:#3A2420; --warn:#E2B45A; --warn-soft:#352C18;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#14172B; --surface:#1C2038; --ink:#EFE7D8; --muted:#A39C8C; --line:#2E3352;
  --accent:#8FC3B5; --accent-soft:#233A3C; --on-accent:#14172B; --cream:#3B3524;

.sentence{font-family:var(--body)}
/* 今日のヒーロー: 日替わりの生成アート */
.hero{position:relative;border-radius:16px;overflow:hidden;background:var(--navy);aspect-ratio:16/10;margin:-4px -4px 0}
.hero canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.hero .hmeta{position:absolute;left:0;right:0;top:0;display:flex;justify-content:space-between;padding:12px 14px;font-family:var(--mono);font-size:.62rem;letter-spacing:.22em;color:var(--hfg,#EFE7D8);text-transform:uppercase}
.hero .htitle{position:absolute;left:14px;right:14px;bottom:30px;color:var(--hfg,#EFE7D8)}
.hero .htitle .eb{font-family:var(--mono);font-size:.66rem;letter-spacing:.22em}
.hero .htitle b{display:block;font-family:var(--display);font-weight:900;font-size:1.9rem;line-height:1.15;letter-spacing:.02em}
.hero .htitle small{font-family:var(--mono);font-size:.7rem;letter-spacing:.08em;opacity:.85}
.hero .ruler{position:absolute;left:14px;right:14px;bottom:12px;height:9px;background:repeating-linear-gradient(90deg, var(--hfg,#EFE7D8) 0 1px, transparent 1px 6px);opacity:.55}
.hero .ruler i{position:absolute;left:0;top:-3px;bottom:-1px;width:2px;background:#E5533C}
.bignums{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.bignums div{display:flex;flex-direction:column;gap:2px}
.bignums span{font-family:var(--mono);font-size:.62rem;letter-spacing:.2em;color:var(--muted);text-transform:uppercase}
.bignums b{font-family:var(--display);font-weight:900;font-size:1.7rem;line-height:1;font-variant-numeric:tabular-nums}
.hidden{display:none!important}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
@media (max-width:400px){.word{font-size:1.8rem}}

/* ══════════ MIMI 52 ポスターの世界観（ここから下が最終の見た目） ══════════
   一面のセージ色・斜めに降る深緑の線・深緑の円がひとつ・黒い文字だけ。
   カードは紙ではなく「霧」: 背景を少しだけ曇らせて文字を読みやすくする。 */
:root{
  --bg:#f3f3f0; --surface:rgba(255,255,255,.84); --ink:#111413; --muted:rgba(17,20,19,.6); --line:rgba(17,20,19,.12);
  --accent:#006945; --accent-soft:rgba(0,105,69,.13); --on-accent:#eaf4f0;
  --rust:#006945; --ochre:#006945; --cream:rgba(234,244,240,.32); --navy:#06120f;
  --good:#006945; --good-soft:rgba(0,105,69,.14); --bad:#7d2a1f; --bad-soft:rgba(125,42,31,.12); --warn:#06120f; --warn-soft:rgba(6,18,15,.08);
  --display:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Apple SD Gothic Neo","Noto Sans KR",sans-serif;
  --body:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Apple SD Gothic Neo","Noto Sans KR",sans-serif;
  --mono:var(--body);
  --rain1:#e4e4df; --rain2:#d8d8d2; --rain3:#ebebe7; --rainHi:#cfe5da;
}
html[lang="ko"]{ --display:"Apple SD Gothic Neo","Noto Sans KR","Hiragino Sans",sans-serif; --body:"Apple SD Gothic Neo","Noto Sans KR","Hiragino Sans",sans-serif; }
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#121317; --surface:rgba(28,30,36,.86); --ink:#eceef2; --muted:rgba(236,238,242,.62); --line:rgba(236,238,242,.13);
  --accent:#3fc28c; --accent-soft:rgba(63,194,140,.14); --on-accent:#06120f; --rust:#3fc28c; --cream:rgba(220,239,232,.1);
  --good:#3fc28c; --good-soft:rgba(63,194,140,.14); --bad:#ef8a72; --bad-soft:rgba(239,138,114,.12); --warn:#dcefe8; --warn-soft:rgba(220,239,232,.07);
  --rain1:#1c1e24; --rain2:#16171c; --rain3:#212329; --rainHi:#1d3a30; color-scheme:dark; } }
:root[data-theme="dark"]{
  --bg:#121317; --surface:rgba(28,30,36,.86); --ink:#eceef2; --muted:rgba(236,238,242,.62); --line:rgba(236,238,242,.13);
  --accent:#3fc28c; --accent-soft:rgba(63,194,140,.14); --on-accent:#06120f; --rust:#3fc28c; --cream:rgba(220,239,232,.1);
  --good:#3fc28c; --good-soft:rgba(63,194,140,.14); --bad:#ef8a72; --bad-soft:rgba(239,138,114,.12); --warn:#dcefe8; --warn-soft:rgba(220,239,232,.07);
  --rain1:#1c1e24; --rain2:#16171c; --rain3:#212329; --rainHi:#1d3a30; color-scheme:dark; }
html,body{background:var(--bg)}
#rain{position:fixed;inset:0;width:100vw;height:100vh;z-index:0;pointer-events:none;display:block}
.wrap{position:relative;z-index:1}
/* 見出し: 太い和文、字間は詰め気味 */
h1,h2{font-family:var(--display);font-weight:700;letter-spacing:.01em}
h1{font-size:.95rem;font-weight:600;letter-spacing:.32em}
.top #todayLabel{font-family:var(--body);font-weight:600;font-size:.72rem;letter-spacing:.3em;color:var(--ink);opacity:.85}
.eyebrow{font-family:var(--body);font-weight:600;letter-spacing:.3em;color:var(--ink)}
/* カード = 霧のパネル（枠なし・角は控えめ） */
.card{background:var(--surface);border:0;border-radius:6px;box-shadow:none;-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
/* ボタン: 平たく、主ボタンだけ深緑 */
.btn{border-radius:4px;border:1px solid var(--line);background:transparent;color:var(--ink);font-family:var(--body);font-weight:600;letter-spacing:.04em}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.good{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.bad{background:transparent;border-color:var(--bad);color:var(--bad)}
input[type=text],input[type=email],textarea,select,input[type=number]{background:rgba(234,244,240,.22);border:1px solid var(--line);border-radius:4px;color:var(--ink)}
input::placeholder,textarea::placeholder{color:var(--muted)}
.kbd button{background:rgba(234,244,240,.18);border-color:var(--line);color:var(--ink);border-radius:4px}
/* タブ: 字間の広い小さなラベル、選ばれたら深緑の下線 */
nav.tabs{background:color-mix(in srgb, var(--bg) 86%, transparent);border-bottom:1px solid var(--line)}
nav.tabs button{font-family:var(--body);font-weight:600;font-size:.82rem;letter-spacing:.14em;color:var(--muted)}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.langbtn,.iconbtn{background:transparent;border-color:var(--line);color:var(--ink)}
/* チップ・小ラベル */
.chip{background:transparent;border:1px solid var(--line);color:var(--ink);font-family:var(--body);font-weight:600;letter-spacing:.06em;border-radius:3px}
.chip.new{border-color:var(--accent);color:var(--accent)}
.chip.done{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.chip.leech{border-color:var(--bad);color:var(--bad)}
.chiptog{background:transparent;border-color:var(--line);color:var(--muted);border-radius:3px}
.chiptog[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.modehead .muted.small{font-family:var(--body);font-weight:600;letter-spacing:.24em;font-size:.7rem;color:var(--ink)}
/* 問題の単語・文 */
.word{font-family:var(--display);font-weight:700;letter-spacing:.01em}
mark,.tok.hl{background:transparent;color:var(--accent);border-bottom:2px solid var(--accent);border-radius:0}
.blank{background:var(--cream);border-bottom:2px solid var(--accent);color:var(--accent);border-radius:2px 2px 0 0}
/* 進み具合 = ポスター下の目盛り（左端に深緑のバー） */
.progress{height:16px;background:repeating-linear-gradient(90deg, var(--ink) 0 1px, transparent 1px 8px);opacity:.55}
.progress::after{display:none}
.progress i{background:none;border-right:4px solid var(--accent);opacity:1}
/* フィードバック */
.feedback{border-radius:4px;background:rgba(234,244,240,.2)}
.feedback.ok{background:var(--good-soft)} .feedback.no{background:var(--bad-soft)} .feedback.meh{background:var(--warn-soft)}
.feedback.ok strong{color:var(--good)} .feedback.no strong{color:var(--bad)} .feedback.meh strong{color:var(--ink)}
.bubble{background:rgba(234,244,240,.9);border:1.5px solid var(--ink);color:#06120f;font-weight:600}
.bubble::after{border-right-color:rgba(234,244,240,.9)!important}
.say.big .bubble::after{border-bottom-color:rgba(234,244,240,.9)!important;border-right-color:transparent!important}
.toast{background:var(--ink);color:var(--bg);border-radius:4px}
.sheet{background:var(--bg);border-radius:10px 10px 0 0}
.sheet .x{background:transparent;border-color:var(--line);color:var(--ink)}
.ex,.cand{background:rgba(234,244,240,.16);border-color:var(--line);border-radius:4px}
.cand[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent)}
.item{border-bottom-color:var(--line)}
.bignums span{font-family:var(--body);font-weight:600;letter-spacing:.24em;color:var(--ink);opacity:.75}
.bignums b{font-family:var(--display);font-weight:700}
/* 「今日」= ポスター: 上は空けて雨を見せ、下に大きな題名と目盛り */
#sessionStart.card{background:transparent;-webkit-backdrop-filter:none;backdrop-filter:none;padding-left:0;padding-right:0}
.poster{display:flex;flex-direction:column;gap:8px;padding-top:min(34vh,300px)}
.poster .pweek{font-weight:600;font-size:.82rem;letter-spacing:.3em;color:var(--ink)}
.poster .pweek em{font-style:normal;color:var(--accent)}
.poster .ptitle{font-family:var(--display);font-weight:700;font-size:clamp(2rem,9vw,2.9rem);line-height:1.12;letter-spacing:.01em;color:var(--ink)}
.poster .psub{font-size:.9rem;letter-spacing:.06em;color:var(--ink);opacity:.85}
.poster .pruler{position:relative;height:18px;margin-top:6px;background:repeating-linear-gradient(90deg, var(--ink) 0 1px, transparent 1px 9px);opacity:.55}
.poster .pruler i{position:absolute;top:-2px;bottom:-2px;width:5px;background:var(--accent);opacity:1}
.poster + *{margin-top:10px}
.after-poster{background:var(--surface);border-radius:6px;padding:16px;display:flex;flex-direction:column;gap:14px;-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}

/* ══════════ 液体ガラス: 文字のある場所はすりガラスの板に載せる ══════════ */
:root{
  --glass:rgba(255,255,255,.62); --glass-strong:rgba(255,255,255,.8); --glass-edge:rgba(255,255,255,.9); --glass-shadow:0 10px 30px rgba(20,22,26,.08), 0 1px 2px rgba(20,22,26,.06);
  --ink:#111413; --muted:#5d6461; --line:rgba(17,20,19,.1);
  --field:rgba(255,255,255,.7);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --glass:rgba(30,32,38,.6); --glass-strong:rgba(30,32,38,.78); --glass-edge:rgba(255,255,255,.1); --glass-shadow:0 10px 30px rgba(0,0,0,.35);
  --ink:#eceef2; --muted:#a9adb5; --line:rgba(238,247,243,.14); --field:rgba(0,0,0,.25); } }
:root[data-theme="dark"]{
  --glass:rgba(30,32,38,.6); --glass-strong:rgba(30,32,38,.78); --glass-edge:rgba(255,255,255,.1); --glass-shadow:0 10px 30px rgba(0,0,0,.35);
  --ink:#eceef2; --muted:#a9adb5; --line:rgba(238,247,243,.14); --field:rgba(0,0,0,.25); }
body{line-height:1.7;color:var(--ink)}
.muted{color:var(--muted)}
.glass, .card, #sessionStart.card, .top, nav.tabs, .sheet, .toast{
  background:var(--glass);
  -webkit-backdrop-filter:blur(22px) saturate(170%); backdrop-filter:blur(22px) saturate(170%);
  border:1px solid var(--glass-edge);
  box-shadow:var(--glass-shadow), inset 0 1px 0 rgba(255,255,255,.55), inset 0 -1px 0 rgba(255,255,255,.12);
}
.card, #sessionStart.card{border-radius:24px;padding:22px}
#sessionStart.card{padding-left:22px;padding-right:22px}
/* 上の見出しとタブもガラスの帯に */
.top{border-radius:22px;padding:14px 16px;margin-bottom:-4px}
.top #todayLabel{opacity:1;color:var(--muted)}
nav.tabs{border-radius:999px;padding:5px;gap:4px;top:calc(10px + env(safe-area-inset-top))}
nav.tabs button{border-radius:999px;border-bottom:0;color:var(--muted);letter-spacing:.08em}
nav.tabs button[aria-selected="true"]{background:var(--glass-strong);color:var(--ink);box-shadow:0 2px 8px rgba(6,30,24,.12), inset 0 1px 0 rgba(255,255,255,.7)}
/* 「今日」: 上は雨を見せる余白、題名から下はガラスの板 */
body:not(.focus) #view-today::before{content:"";display:block;height:min(24vh,200px)}
.poster{padding-top:0}
.poster .pweek,.poster .ptitle,.poster .psub{color:var(--ink);opacity:1}
.poster .psub{color:var(--muted)}
.after-poster{background:transparent;padding:0;-webkit-backdrop-filter:none;backdrop-filter:none;border-top:1px solid var(--line);padding-top:16px;border-radius:0}
/* 入力欄は白っぽく、くっきり */
input[type=text],input[type=email],textarea,select,input[type=number]{background:var(--field);border:1px solid var(--line);border-radius:12px;color:var(--ink)}
.kbd button{background:var(--field);border-color:var(--line);border-radius:10px}
.btn{border-radius:14px;border-color:var(--line);background:var(--field)}
.btn.ghost{background:transparent}
.btn.primary,.btn.good{background:var(--accent);border-color:transparent;color:#fff;box-shadow:0 4px 14px rgba(0,105,69,.28), inset 0 1px 0 rgba(255,255,255,.25)}
.langbtn,.iconbtn{background:var(--field);border-color:var(--line)}
.chip,.chiptog{border-radius:999px}
.feedback{border-radius:16px}
.feedback.ok{background:rgba(0,105,69,.12)} .feedback.no{background:rgba(125,42,31,.1)} .feedback.meh{background:rgba(11,26,22,.06)}
.bubble{background:var(--glass-strong);border:1px solid var(--glass-edge);color:var(--ink);box-shadow:0 6px 18px rgba(6,30,24,.14)}
.bubble::before{display:none}
.bubble::after{border-right-color:var(--glass-strong)!important}
.say.big .bubble::after{border-bottom-color:var(--glass-strong)!important;border-right-color:transparent!important}
.sentence{line-height:1.75}
.small{line-height:1.65}
.toast{color:var(--ink);background:var(--glass-strong)}
.sheet{border-radius:28px 28px 0 0}
.sheet-bg{background:rgba(6,20,17,.25);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
.ex,.cand{background:var(--field);border-radius:14px}
.progress{opacity:.7}

/* ══════════ もっと丸く ══════════ */
.card, #sessionStart.card{border-radius:32px}
.top{border-radius:28px}
.btn{border-radius:999px;padding-left:20px;padding-right:20px}
.btn.sm{border-radius:999px;padding-left:14px;padding-right:14px}
input[type=text],input[type=email],textarea,select,input[type=number]{border-radius:20px;padding:12px 16px}
textarea{border-radius:22px}
.answer{border-radius:22px}
.kbd button{border-radius:14px}
.feedback{border-radius:24px;padding:16px 18px}
.bubble{border-radius:22px 22px 22px 8px}
.say.big .bubble{border-radius:22px}
.sheet{border-radius:32px 32px 0 0}
.ex,.cand{border-radius:20px}
.blank{border-radius:10px 10px 4px 4px}
.chip{border-radius:999px;padding:3px 11px}
.langbtn,.iconbtn{border-radius:999px}
.deckrow input[type=text]{border-radius:14px}
.ocrimg{border-radius:20px}
.progress i{border-radius:3px}
.poster .pruler i{border-radius:3px}
.item{border-radius:14px;padding-left:8px;padding-right:8px}

.modehead{flex-wrap:nowrap}
.modehead .muted.small{letter-spacing:.12em;min-width:0}
.modehead .btn.sm, #homeBtn, #gradBtn{white-space:nowrap;padding:5px 12px;flex-shrink:0}
.toast{border-radius:999px;padding:12px 20px;background:var(--ink);color:var(--bg);-webkit-backdrop-filter:none;backdrop-filter:none;box-shadow:0 10px 30px rgba(6,30,24,.25);text-align:center;max-width:min(90vw,420px)}

/* ══════════ 今日の横（PC）/ 下（スマホ）のパネル ══════════ */
body:not(.focus) #view-today::before{height:min(12vh,110px)}
body.focus #todaySide{display:none}
.side{gap:18px}
.side .eyebrow{font-size:.68rem;letter-spacing:.26em;opacity:.8}
.side .fc i{background:var(--accent);opacity:.55;border-radius:6px 6px 2px 2px}
.side .fc.today i{opacity:1}
.side .forecast{height:110px}
.streak{display:grid;grid-template-columns:repeat(7,minmax(0,20px));justify-content:space-between;gap:8px 6px}
.streak span{aspect-ratio:1;border-radius:50%;background:var(--line)}
.streak span.on{background:var(--accent)}
.streak span.today{outline:2px solid var(--accent);outline-offset:2px}
.mini-ladder{display:flex;gap:6px}
.mini-ladder div{flex:1;border-radius:14px;background:var(--field);border:1px solid var(--line);padding:8px 4px;text-align:center}
.mini-ladder b{display:block;font-size:1.15rem;font-weight:700}
.mini-ladder span{font-size:.66rem;color:var(--muted)}
.side .sidebig{display:flex;align-items:baseline;gap:8px}
.side .sidebig b{font-size:2.4rem;font-weight:700;line-height:1;color:var(--accent)}
@media (min-width: 900px){
  html{font-size:17px}
  .wrap{max-width:1040px}
  #view-today:not(.hidden){display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:18px;align-items:start}
  body:not(.focus) #view-today::before{grid-column:1 / -1;height:min(16vh,140px)}
  #sessionBox{grid-column:1 / -1;max-width:680px;width:100%;justify-self:center}
  body.focus #view-today:not(.hidden){display:block}
  #view-add,#view-list,#view-how{max-width:680px;width:100%;margin:0 auto}
  .top,nav.tabs{max-width:100%}
}

/* ══════════ ロゴ・スマホの余白 ══════════ */
h1{display:flex;flex-direction:column;gap:2px;letter-spacing:0}
h1 .logo{font-size:.95rem;font-weight:700;letter-spacing:.34em;line-height:1.2}
h1 .logo-sub{font-size:.74rem;font-weight:600;letter-spacing:.18em;color:var(--muted)}
@media (max-width: 899px){
  body:not(.focus) #view-today::before{height:0;display:none}
  .top{padding:12px 16px;gap:6px}
  .top #todayLabel{font-size:.66rem;letter-spacing:.24em;margin-top:0}
  .poster .ptitle{font-size:clamp(1.6rem,7.2vw,2.3rem)}
  .poster .pweek{font-size:.72rem;letter-spacing:.22em}
  .card, #sessionStart.card{padding:18px}
  nav.tabs button{font-size:.8rem;letter-spacing:.04em;padding:9px 2px}
}

@media (max-width: 899px){
  .top{flex-wrap:wrap;align-items:center}
  .titlebar{flex:1;min-width:0;gap:6px}
  h1 .logo{font-size:.8rem;letter-spacing:.2em;white-space:nowrap}
  h1 .logo-sub{font-size:.68rem;letter-spacing:.12em}
  .langbtn{padding:2px 7px 2px 5px}
  .iconbtn{padding:5px 9px}
}

/* ══════════ 解答画面: 上の固定ステージ（問題と答え）・下のドック（入力と操作） ══════════ */
body.focus nav.tabs{display:none}
body.focus #sessionBox{position:fixed;z-index:6;top:calc(var(--vvt,0px) + 8px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);
  width:min(680px, calc(100vw - 16px));height:calc(var(--vvh,100dvh) - 16px - env(safe-area-inset-top) - env(safe-area-inset-bottom));
  display:flex;flex-direction:column;gap:10px;padding:16px 16px 14px;overflow:hidden;border-radius:28px}
.stage{display:flex;flex-direction:column;gap:12px}
body.focus .stage{flex:1 1 auto;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:2px 2px 6px}
.dock{display:flex;flex-direction:column;gap:10px}
body.focus .dock{flex-shrink:0;border-top:1px solid var(--line);padding-top:12px}
body.focus .dock textarea{min-height:64px;max-height:120px}
body.focus .say .bubble{font-size:.84rem;padding:7px 12px}
.blank.filled{color:var(--accent);font-weight:700;border-bottom-color:var(--accent);background:rgba(0,105,69,.12);min-width:0;padding:0 6px}
.blank.filled.no{color:var(--bad);border-bottom-color:var(--bad);background:rgba(125,42,31,.1)}

/* ══════════ 文字の強弱: 主役だけ濃く・大きく、まわりは薄く・小さく ══════════ */
/* 主役: 問題文・単語・答え */
.stage .sentence{font-size:1.32rem;font-weight:500;color:var(--ink);line-height:1.65}
.stage .word{font-size:2.1rem;font-weight:700;color:var(--ink)}
.fb-answer{font-size:1.55rem;font-weight:700;color:var(--accent);line-height:1.3}
.feedback.no .fb-answer{color:var(--bad)}
/* 脇役: 訳・意味 */
.q-sub,.fb-mean{font-size:.92rem;color:var(--muted);font-weight:400}
.fb-ex{font-size:.92rem;color:var(--ink)}
/* 背景: ヒント・小見出し・残り枚数 */

  note3:"<b>간격은 단어마다 늘어난다.</b> 잊어버릴 즈음에 떠올린 단어일수록 다음 간격이 크게 늘어납니다 (FSRS 망각곡선 모델). 하루 복습은 상한까지, 밀린 것부터. 날짜는 ±5% 흩어서 한 날에 몰리지 않게 했습니다.",

/* ───────── 辞書・例文 API ───────── */
async function getJSON(url, ms=12000){
  const ctl = new AbortController(); const tm = setTimeout(()=>ctl.abort(), ms);
  try{ const r = await fetch(url, { signal: ctl.signal }); if(!r.ok) throw new Error("HTTP " + r.status); return await r.json(); }
  finally{ clearTimeout(tm); }
}
const trCache = {};
async function translate(text, from){
  const to = U().mm;
  if(!text) return ""; if(from === to) return text;
  const key = from + "|" + to + "|" + text; if(trCache[key]) return trCache[key];
  const p = new URLSearchParams({ q: text.slice(0, 480), langpair: from + "|" + to });
  if(S.meta.settings.email) p.set("de", S.meta.settings.email);
  const d = await getJSON("https://api.mymemory.translated.net/get?" + p.toString());
  if(d && d.quotaFinished) throw new Error("quota");
  const first = (d && d.responseData && d.responseData.translatedText) || "";
  if(/MYMEMORY WARNING|QUERY LENGTH/i.test(first)) throw new Error("quota");
  const ranked = rankTranslations(text, to, first, (d && d.matches) || []);
  ALTS[key] = ranked.slice(0, 5);
  const out = ranked[0] || "";
  trCache[key] = out; return out;
}
const ALTS = {};
const altsFor = (text, from) => ALTS[from + "|" + U().mm + "|" + text] || [];
const clean = t0 => String(t0||"").replace(/&#39;/g,"'").replace(/&quot;/g,'"').replace(/&amp;/g,"&").replace(/^[\[「『(（]+|[\]」』)）]+$/g, "").replace(/[.。]$/, "").trim();
/* 翻訳メモリの候補を採点: 一致度・品質・複数回出たもの・言語らしさ */
function rankTranslations(src, to, first, matches){
  const score = new Map();
  const add = (tx, sc) => { tx = clean(tx); if(!tx || tx.length > 60) return; const k = tx.toLowerCase(); const cur = score.get(k); score.set(k, cur ? { tx: cur.tx, sc: cur.sc + 15 + Math.max(0, sc - cur.base) * 0, base: cur.base } : { tx, sc, base: sc }); };
  const nativeSrc = /[\u3040-\u30ff\u4e00-\u9fff\uac00-\ud7af]/.test(src);
  const penalty = tx => {
    let pen = 0;
    if(to === "ja" && /^[\u30a0-\u30ffー・\s]+$/.test(tx) && nativeSrc) pen += 20;     // 漢字・ハングルの語なのに全部カタカナ
    if(to === "ko" && /^[A-Za-z\s]+$/.test(tx)) pen += 20;
    if(to === "ja" && /^[A-Za-z\s]+$/.test(tx)) pen += 20;
    return pen;
  };
  matches.forEach(m => { const tx = clean(m.translation); if(!tx) return; const q = Number(m.quality) || 0; add(tx, (Number(m.match) || 0) * 100 + q / 10 - penalty(tx)); });
  if(first) add(first, 99 - penalty(clean(first)));
  return [...score.values()].sort((a,b) => b.sc - a.sc).map(v => v.tx);
}
async function wiktionary(word){
  try{
    const d = await getJSON("https://en.wiktionary.org/api/rest_v1/page/definition/" + encodeURIComponent(word.replace(/ /g,"_")), 8000);
    const entries = d[L().wikt] || []; const out = [];
    entries.forEach(e => (e.definitions||[]).forEach(df => { const tx = String(df.definition||"").replace(/<[^>]+>/g,"").trim(); if(tx && out.length < 4) out.push({ pos: e.partOfSpeech, def: tx }); }));
    return out;
  }catch(e){ return []; }
}
function searchTerm(word){ let w = String(word||"").trim(); const a = L().articles; if(a) w = w.replace(a, ""); return w.trim(); }
async function tatoeba(word){
  const lang = L(), mine = U().tatoeba;
  const term = searchTerm(word);
  const trLangs = mine === "eng" ? "eng" : mine + ",eng";
  const base = { lang: lang.tatoeba, sort: "relevance", limit: "20", is_unapproved: "no", "trans:lang": trLangs, "showtrans:lang": trLangs, include: "audios" };
  if(!["jpn","kor"].includes(lang.tatoeba)) base.word_count = "4-16";
  const run = async q => { const p = new URLSearchParams(Object.assign({}, base, { q })); const d = await getJSON("https://api.tatoeba.org/v1/sentences?" + p.toString()); return (d && d.data) || []; };
  let rows = await run(term.includes(" ") ? '"' + term + '"' : term);
  if(rows.length < 3 && !term.includes(" ") && term.length > 4){
    try{ const stem = stripAcc(term).replace(/se$/i,"").replace(/(ar|er|ir|re|en)$/i, ""); if(stem.length >= 3){ const more = await run(stem + "*"); const seen = new Set(rows.map(r=>r.id)); more.forEach(r => { if(!seen.has(r.id)) rows.push(r); }); } }catch(e){}
  }
  return rows.map(r => {
    const tr = r.translations || [];
    const own = tr.find(x => x.lang === mine); const en = tr.find(x => x.lang === "eng");
    const words = r.text.split(/\s+/).length;
    const form = findForm(r.text, word);
    const audio = (r.audios && r.audios[0] && r.audios[0].id) ? "https://tatoeba.org/audio/download/" + r.audios[0].id : null;
    const exact = form && stripAcc(form.toLowerCase()) === stripAcc(term.toLowerCase());
    const score = (own ? 0 : 10) + Math.abs(words - 8) + (form ? 0 : 20) - (exact ? 8 : 0) + (r.text.length > 110 ? 10 : 0) - (audio ? 3 : 0);
    return { id: r.id, text: r.text, tr: own ? own.text : "", en: en ? en.text : "", form, score, audio };
  }).sort((a,b) => a.score - b.score).slice(0, 6);
}
async function lookup(word){
  const [m, c, w] = await Promise.allSettled([ translate(searchTerm(word), L().mm), tatoeba(word), wiktionary(searchTerm(word)) ]);
  return {
    meaning: m.status === "fulfilled" ? m.value : "",
    meaningErr: m.status === "rejected" ? String(m.reason && m.reason.message || "") : "",
    cands: c.status === "fulfilled" ? c.value : [], candsErr: c.status === "rejected",
    wikt: w.status === "fulfilled" ? w.value : []
  };
}
async function trOf(cand){
  if(cand.tr) return cand.tr;
  try{ return await translate(cand.text, L().mm); }catch(e){ return cand.en ? t().enPrefix + cand.en : ""; }
}

const isLeech = c => c.lapses >= LEECH;
function levelChip(c){
  if(c.mastered) return `<span class="chip done">${t().chipDone}</span>`;
  if(c.isNew) return `<span class="chip new">${t().chipNew}</span>`;
  return `<span class="chip">${t().levels[Math.min(c.level, 5)]}${t().levelSuffix}</span>` + (isLeech(c) ? ` <span class="chip leech">${t().chipLeech}</span>` : "");
}
/* 復習間隔は単語ごとに決める: 記憶の強さ S（日）と難しさ D（1〜10）。想起確率 R = (1 + t/(9S))^-1（FSRS の忘却曲線）。
   R が目標（既定 80%）まで下がる日にもう一度出す。正解すると S が伸び（忘れかけで正解したほど大きく）、間違えると縮む。間隔が 180 日を超えたら卒業。 */
const TARGET = () => Math.min(.95, Math.max(.7, Number(S.meta.settings.target) || .8));
const LV_OF = iv => iv < 3 ? 1 : iv < 10 ? 2 : iv < 30 ? 3 : iv < 90 ? 4 : 5;
function memInit(c){   // 以前の版（段で管理）からの引き継ぎ
  if(c.S) return; const iv = [1, 1, 7, 21, 60, 150][Math.min(5, c.level || 1)] || 1;
  c.S = Math.max(1, iv / (9 * (1 / TARGET() - 1))); c.D = Math.min(9, 5 + (c.lapses || 0) * .8);
  c.last = c.due ? addDays(c.due, -iv) : (c.introduced || today());
}
function schedule(c, correct){
  const d = today();
  c.reps++; c.log.push({ d, ok: correct }); if(c.log.length > 40) c.log = c.log.slice(-40);
  const wasNew = c.isNew;
  if(c.isNew){ c.isNew = false; c.introduced = d; c.S = correct ? 2.4 : 1.0; c.D = correct ? 5 : 6.5; c.last = d; c.level = 1; c.due = addDays(d, 1); c.relearn = !correct; if(!correct) c.lapses++; return; }
  memInit(c);
  const t = Math.max(0, diffDays(c.last || d, d)), R = Math.pow(1 + t / (9 * c.S), -1);
  if(correct){ c.S = c.S * (1 + 2.6 * ((11 - c.D) / 10) * Math.pow(c.S, -0.15) * (Math.exp((1 - R) * 1.4) - 1) + 0.15); c.D = Math.max(1, c.D - 0.3); c.relearn = false; }
  else { c.lapses++; c.S = Math.max(0.4, c.S * 0.3); c.D = Math.min(10, c.D + 1.2); c.relearn = true; }
  c.last = d;
  if(!correct){ c.level = 1; c.due = addDays(d, 1); return; }
  let iv = Math.max(1, Math.round(9 * c.S * (1 / TARGET() - 1)));
  if(iv >= 7){ const f = Math.max(1, Math.round(iv * .05)); iv += Math.floor(Math.random() * (2 * f + 1)) - f; }
  c.level = LV_OF(iv);
  if(iv > 180){ c.mastered = true; c.due = null; return; }
  c.due = addDays(d, Math.min(365, iv));
}
function findForm(text, word){
  const ex = text || ""; const w = searchTerm(word);
  if(!ex || !w) return "";
  const low = stripAcc(ex.toLowerCase()), lw = stripAcc(w.toLowerCase());
  const i = low.indexOf(lw); if(i >= 0) return ex.slice(i, i + w.length);
  if(/\s/.test(w)) return "";
  const base = lw.replace(/se$/,"").replace(/(ar|er|ir|re|en)$/,""); const stem = base.length >= 3 ? base : lw.slice(0, 3);
  const re = /[\p{L}]+/gu; let m;
  while((m = re.exec(ex))){ if(stripAcc(m[0].toLowerCase()).startsWith(stem)) return m[0]; }
  return "";
}
function clozeParts(c){
  const ex = c.example || ""; if(!ex) return null;
  const f = (c.form && stripAcc(ex.toLowerCase()).includes(stripAcc(c.form.toLowerCase()))) ? c.form : findForm(ex, c.word);
  if(!f) return null;
  const i = stripAcc(ex.toLowerCase()).indexOf(stripAcc(f.toLowerCase()));
  return { before: ex.slice(0, i), answer: ex.slice(i, i + f.length), after: ex.slice(i + f.length) };
}
function tokHTML(text, hlFrom, hlTo){
  const out = []; const re = /[\p{L}\p{M}][\p{L}\p{M}'’\-]*/gu; let last = 0, m;
  text = String(text || "");
  while((m = re.exec(text))){
    out.push(esc(text.slice(last, m.index)));
    const hl = hlFrom != null && m.index < hlTo && m.index + m[0].length > hlFrom;
    out.push(`<span class="tok${hl ? " hl" : ""}" role="button" tabindex="0" data-w="${esc(m[0])}">${esc(m[0])}</span>`);
    last = m.index + m[0].length;
  }
  out.push(esc(text.slice(last)));
  return out.join("");
}
function siblings(c){
  if(!c.group) return "";
  const sib = Object.values(S.cards).filter(o => o.group === c.group && o.id !== c.id && (o.lang||"es") !== (c.lang||"es"));
  return sib.length ? `<span class="sib">${sib.map(o => `${FLAGS[o.lang||"es"] || ""} ${esc(o.word)}`).join(" · ")}</span>` : "";
}
function highlight(c){ const p = clozeParts(c); return p ? tokHTML(c.example, p.before.length, p.before.length + p.answer.length) : tokHTML(c.example); }
function hlText(text, form){ if(!form) return esc(text); const i = stripAcc(text.toLowerCase()).indexOf(stripAcc(form.toLowerCase())); if(i < 0) return esc(text); return esc(text.slice(0,i)) + "<mark>" + esc(text.slice(i, i+form.length)) + "</mark>" + esc(text.slice(i+form.length)); }
function check(input, target){
  const a = norm(input), b = norm(target);
  if(!a) return "no"; if(a === b) return "ok";
  if(stripAcc(a) === stripAcc(b)) return S.meta.settings.strictAccent ? "no" : "accent";
  return "no";
}

function voicesFor(langCode){ const pre = langCode.slice(0,2).toLowerCase(); return VOICES.filter(v => v.lang && v.lang.toLowerCase().replace("_","-").startsWith(pre)); }
function voiceScore(v, want){
  let sc = 0; const n = (v.name || "").toLowerCase(); const l = (v.lang || "").toLowerCase().replace("_","-");
  if(l === want.toLowerCase()) sc += 3;
  if(/premium|enhanced|neural|natural|拡張|プレミアム|향상|프리미엄/.test(n)) sc += 6;
  if(/google/.test(n)) sc += 4;
  if(/siri/.test(n)) sc += 5;
  if(/monica|mónica|jorge|paulina|marisol|lucia|lucía|diego|helena|alvaro|álvaro|elvira/.test(n)) sc += 2;
  if(/compact|eloquence|grandma|grandpa|novelty|bad news|bells|boing|bubbles|cellos|whisper|zarvox|trinoids|albert|jester|organ|superstar|wobble|fred|junior|ralph|kathy|rocko|shelley|flo|reed|sandy/.test(n)) sc -= 8;
  return sc;
}
function pickVoice(){
  const lang = L(), list = voicesFor(lang.speech); if(!list.length) return null;
  const chosen = (S.meta.settings.voices || {})[S.meta.settings.lang];
  if(chosen){ const v = list.find(v => v.voiceURI === chosen); if(v) return v; }
  return list.slice().sort((a,b) => voiceScore(b, lang.speech) - voiceScore(a, lang.speech))[0];
}
function fillVoices(){

function drawRain(){
  const cv = $("#rain"); if(!cv) return;
  const css = getComputedStyle(document.documentElement);
  const col = n => css.getPropertyValue(n).trim();
  const w = window.innerWidth, h = window.innerHeight, dpr = Math.min(2, window.devicePixelRatio || 1);
  cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
  const g = cv.getContext("2d"); g.setTransform(dpr, 0, 0, dpr, 0, 0);
  g.fillStyle = col("--bg"); g.fillRect(0, 0, w, h);
  const r = seededRand(today() + "rain" + S.meta.settings.lang);
  const cols = [[col("--rain1"), .8], [col("--rain2"), .8], [col("--rain3"), .5], [col("--rain1"), .5]];
  const lean = 0.16 + r() * 0.1, n = Math.round((w * h) / 9000);
  for(let i = 0; i < n; i++){
    const thick = r() < 0.12; const [c, op] = cols[Math.floor(r() * cols.length)];
    const x = r() * (w + h * lean) - h * lean * 0.2, y = -40 + r() * h * 1.05, len = 60 + r() * (thick ? 260 : 420);
    const bend = (r() - 0.5) * 30;
    g.beginPath(); g.moveTo(x, y);
    g.quadraticCurveTo(x - len * lean * 0.5 + bend, y + len * 0.5, x - len * lean, y + len);
    g.strokeStyle = c; g.globalAlpha = op * (thick ? 0.28 : 0.45); g.lineWidth = thick ? 2.5 + r() * 4 : 0.5 + r() * 1.2; g.lineCap = "round"; g.stroke();
  }
  for(let i = 0; i < 2; i++){ const x = r() * w, y = r() * h * 0.6, len = 120 + r() * 160; g.beginPath(); g.moveTo(x, y); g.lineTo(x - len * lean, y + len); g.strokeStyle = col("--rainHi"); g.globalAlpha = 0.9; g.lineWidth = 2.5; g.stroke(); }
  g.globalAlpha = 1;
  const cx = w * (0.62 + r() * 0.24), cy = Math.min(h * 0.3, 260) * (0.7 + r() * 0.5), rad = Math.max(22, Math.min(w, 600) * 0.07);
  if(w >= 900){ g.beginPath(); g.fillStyle = col("--accent"); g.arc(cx, cy, rad, 0, Math.PI * 2); g.fill(); }   // スマホでは板の下に隠れて「汚れ」に見えるので描かない
}
