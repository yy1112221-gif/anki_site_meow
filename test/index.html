function drawRain(){
  const cv = $("#rain"); if(!cv) return;
  const css = getComputedStyle(document.documentElement);
  const col = n => css.getPropertyValue(n).trim();
  const w = window.innerWidth, h = window.innerHeight, dpr = Math.min(2, window.devicePixelRatio || 1);
  cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
  const g = cv.getContext("2d"); g.setTransform(dpr, 0, 0, dpr, 0, 0);
  g.fillStyle = col("--bg"); g.fillRect(0, 0, w, h);
  const r = seededRand(today() + "rain" + S.meta.settings.lang);
  const cols = [[col("--rain1"), .8], [col("--rain2"), .8], [col("--rain3"), .5], [col("--rain1"), .5]];
  const lean = 0.16 + r() * 0.1, n = Math.round((w * h) / 9000);
  for(let i = 0; i < n; i++){
    const thick = r() < 0.12; const [c, op] = cols[Math.floor(r() * cols.length)];
    const x = r() * (w + h * lean) - h * lean * 0.2, y = -40 + r() * h * 1.05, len = 60 + r() * (thick ? 260 : 420);
    const bend = (r() - 0.5) * 30;
    g.beginPath(); g.moveTo(x, y);
    g.quadraticCurveTo(x - len * lean * 0.5 + bend, y + len * 0.5, x - len * lean, y + len);
    g.strokeStyle = c; g.globalAlpha = op * (thick ? 0.28 : 0.45); g.lineWidth = thick ? 2.5 + r() * 4 : 0.5 + r() * 1.2; g.lineCap = "round"; g.stroke();
  }
  for(let i = 0; i < 2; i++){ const x = r() * w, y = r() * h * 0.6, len = 120 + r() * 160; g.beginPath(); g.moveTo(x, y); g.lineTo(x - len * lean, y + len); g.strokeStyle = col("--rainHi"); g.globalAlpha = 0.9; g.lineWidth = 2.5; g.stroke(); }
  g.globalAlpha = 1;
  const cx = w * (0.62 + r() * 0.24), cy = Math.min(h * 0.3, 260) * (0.7 + r() * 0.5), rad = Math.max(22, Math.min(w, 600) * 0.07);
  g.beginPath(); g.fillStyle = col("--accent"); g.arc(cx, cy, rad, 0, Math.PI * 2); g.fill();
}

/* ════════ 写真の単語の「学習優先度」（AIなし・端末内で計算） ════════
   ① 役に立つ度: 頻度順位 r の対数で山なり（よく出るが基本すぎない 1,000〜6,000位が最高）
   ② 抜くと意味がどれだけ変わるか: 文を IDF 重み付きの語の袋ベクトルで表すと、語 i を抜いたときの
      元の文とのコサイン類似度は √(1 − wᵢ²/Σw²)。よって意味の変化 = 1 − √(1 − wᵢ²/Σw²)（モデル不要・厳密）
   ③ つながり: 文の中で一緒に出る語のグラフで TextRank（多くの語とつながる中心語ほど高い）
   優先度 = ① × (0.45 + 0.35×② + 0.2×③) × 写真の中の登場回数ボーナス。登録済みは除外 */
function sentencesOf(text){ return text.replace(/\s+/g, " ").replace(/([.!?。！？;:])\s+/g, "$1\n").split(/\n|[¡¿]/).map(x => x.trim()).filter(x => x.length > 1); }
async function scoreOcrWords(text){
  const lang = S.meta.settings.lang, stop = new Set((STOP[lang] || "").split(" "));
  const m = await freqMap(lang).catch(() => null);
  const sents = sentencesOf(text).map(line => { const toks = (line.match(/[\p{L}][\p{L}\p{M}'’\-]*/gu) || []).map(w => w.toLowerCase()); return { line, toks, content: toks.filter(k => k.length >= 3 && !stop.has(k)) }; });
  const rank0 = k => m ? (m.get(k) || null) : null;
  // 活用形 → 辞書形（頻度表に載っていて、元の形より順位が上の候補だけ採用）
  const ENDS = ["aríamos","eríamos","iríamos","ábamos","íamos","asteis","isteis","aremos","eremos","iremos","ieron","aron","aban","ió","aste","iste","ían","aba","ía","ando","iendo","ado","ido","ada","ida","amos","emos","imos","áis","éis","ará","erá","irá","an","en","as","es","a","e","o","ó","é","s"];
  const LEM = new Map();
  const lemma = k => { if(LEM.has(k)) return LEM.get(k); let best = { w: k, r: rank0(k) };
    if(m && k.length >= 5 && /^(es|pt|it|fr)$/.test(lang)) for(const e of ENDS){ if(!k.endsWith(e) || k.length - e.length < 3) continue; const b = k.slice(0, -e.length);
      for(const inf of (e === "s" || e === "es" ? ["", "ar","er","ir"] : ["ar","er","ir","are","ere","ire","re"])){ const r = rank0(b + inf); if(r && (!best.r || r < best.r) && (best.w === k ? !rank0(k) || r < rank0(k) : true)) best = { w: b + inf, r }; } }
    LEM.set(k, best); return best; };
  const rank = k => lemma(k).r;
  const idf = k => { const r = rank(k); return r ? Math.log(r + 1) / Math.log(50001) : .9; };   // 0〜1
  const util = k => { const r = rank(k); if(!m) return .6; if(!r) return .3;                      // 一覧にない = 固有名詞・読み間違いが多い
    const dl = Math.log(r) - Math.log(2800); return Math.exp(-(dl ** 2) / (2 * (dl > 0 ? 1.6 : 1.1) ** 2)); };   // 珍しい側はゆるやかに下げる
  const W = new Map();
  sents.forEach(st => { const u = [...new Set(st.content)]; const sum2 = u.reduce((a, k) => a + idf(k) ** 2, 0) || 1;
    u.forEach(k => { const L0 = lemma(k).w; const w = W.get(L0) || { word: L0, tf: 0, abl: 0, lines: [], nb: new Map() }; w.tf += st.content.filter(x => x === k).length;
      w.abl = Math.max(w.abl, 1 - Math.sqrt(Math.max(0, 1 - idf(k) ** 2 / sum2))); w.lines.push(st.line);
      u.forEach(o => { const L1 = lemma(o).w; if(L1 !== L0) w.nb.set(L1, (w.nb.get(L1) || 0) + 1); }); W.set(L0, w); }); });
  // TextRank
  const ks = [...W.keys()]; let pr = new Map(ks.map(k => [k, 1]));
  for(let it = 0; it < 30; it++){ const nx = new Map(); ks.forEach(k => { let sum = 0; W.get(k).nb.forEach((c, o) => { const tot = [...W.get(o).nb.values()].reduce((a, b) => a + b, 0) || 1; sum += pr.get(o) * c / tot; }); nx.set(k, .15 + .85 * sum); }); pr = nx; }
  const prMax = Math.max(1, ...pr.values()), ablMax = Math.max(.01, ...[...W.values()].map(w => w.abl));
  const out = [...W.values()].map(w => {
    const r = rank(w.word), tr = pr.get(w.word) / prMax, ab = w.abl / ablMax;
    const score = util(w.word) * (.45 + .35 * ab + .2 * tr) * (1 + Math.min(2, w.tf - 1) * .5);   // 写真に何度も出る語＝その文章の話題
    // 例文: 5〜18語で、まわりの語が多い（穴埋めで推測しやすい）文
    const line = w.lines.slice().sort((a, b) => { const fa = a.split(" ").length, fb = b.split(" ").length; const ga = fa >= 5 && fa <= 18 ? 0 : 1, gb = fb >= 5 && fb <= 18 ? 0 : 1; return ga - gb || fb - fa; })[0];
    const lv = !m ? "" : !r ? "?" : r < 800 ? "A" : r < 3000 ? "B1" : r < 8000 ? "B2" : "C";
    return { word: w.word, line, score, rank: r, lv, tf: w.tf, abl: ab, tr };
  }).filter(w => !(/^\d/.test(w.word)));
  out.sort((a, b) => b.score - a.score);
  return out;
}

/* ════════ 難易度の目安: OpenSubtitles 頻度リスト（hermitdave/FrequencyWords） ════════ */
const FREQ = {}, FREQ_LOADING = {};
async function freqMap(lang){
  if(FREQ[lang]) return FREQ[lang];
  if(lang === "ja") return null;
  if(!FREQ_LOADING[lang]) FREQ_LOADING[lang] = (async () => {
    const url = `https://raw.githubusercontent.com/hermitdave/FrequencyWords/master/content/2018/${lang}/${lang}_50k.txt`;
    let text = "";
    try{ if("caches" in window){ const cc = await caches.open("focus-vocab-freq"); let r = await cc.match(url); if(!r){ await cc.add(url); r = await cc.match(url); } text = await r.text(); } }catch(e){}
    if(!text){ const r = await fetch(url); if(!r.ok) throw new Error("freq"); text = await r.text(); }
    const m = new Map(); let i = 0;
    for(const line of text.split("\n")){ const w = line.split(" ")[0]; if(!w) continue; i++; if(!m.has(w)) m.set(w, i); }
    FREQ[lang] = m; return m;
  })().catch(() => { delete FREQ_LOADING[lang]; return null; });
  return FREQ_LOADING[lang];
}
function rankOf(m, word){
  const parts = searchTerm(word).toLowerCase().split(/\s+/).filter(Boolean);
  if(!parts.length) return null;
  let worst = 0;
  for(const w of parts){ const r = m.get(w) || m.get(stripAcc(w)); if(!r) return 60000; worst = Math.max(worst, r); }
  return worst;
}
async function ensureRanks(){
  const lang = S.meta.settings.lang; const need = cardsHere().filter(c => c.rank === undefined);
  if(!need.length) return;
  const m = await freqMap(lang); if(!m) return;
  need.forEach(c => { c.rank = rankOf(m, c.word); S.cards[c.id] = c; });
  save(); if(!SES) renderAll();
}
function levelOfRank(r){ if(r == null) return null; return r <= 1000 ? 1 : r <= 4000 ? 2 : r <= 12000 ? 3 : 4; }
const rankChip = c => { const lv = levelOfRank(c.rank); return lv ? `<span class="chip" style="background:transparent;border:1px solid var(--line);color:var(--muted)" title="#${c.rank >= 60000 ? "—" : c.rank}">${esc(t().levelsFreq[lv-1])}</span>` : ""; };

/* ════════ 新しい単語の順番: 例文でつながる単語をまとめて出す ════════ */
function related(a, b){
  const hit = (word, ex) => { if(!ex) return false; const f = findForm(ex, word); return !!f && stripAcc(f.toLowerCase()).slice(0, 4) === stripAcc(searchTerm(word).toLowerCase()).slice(0, 4); };
  return hit(a.word, b.example) || hit(b.word, a.example);
}
function orderNew(list){
  const easy = S.meta.settings.newOrder === "easy";
  const base = list.slice().sort((a,b) => easy ? ((a.rank ?? 99999) - (b.rank ?? 99999)) || (a.created - b.created) : a.created - b.created);
  const known = activeCards().filter(c => !c.isNew);
  const linkedToKnown = new Set(base.filter(c => known.some(k => related(c, k))).map(c => c.id));
  const seeds = base.filter(c => linkedToKnown.has(c.id)).concat(base.filter(c => !linkedToKnown.has(c.id)));
  const out = [], used = new Set();
  const take = c => { if(used.has(c.id)) return; used.add(c.id); out.push(c); base.filter(o => !used.has(o.id) && related(c, o)).forEach(take); };
  seeds.forEach(take);
  out.forEach(c => { c._linked = linkedToKnown.has(c.id) || out.some(o => o !== c && related(o, c)); });
  return out;
}

async function translateTo(text, from, to){
  if(from === to) return text;
  const p = new URLSearchParams({ q: text.slice(0, 480), langpair: from + "|" + to });
  if(S.meta.settings.email) p.set("de", S.meta.settings.email);
  const d = await getJSON("https://api.mymemory.translated.net/get?" + p.toString());
  if(d && d.quotaFinished) throw new Error("quota");
  return ((d && d.responseData && d.responseData.translatedText) || "").replace(/&#39;/g,"'").replace(/&quot;/g,'"').replace(/&amp;/g,"&").replace(/[.。]$/, "").trim();
}

const SB_URL = "https://cgupivfptuzqyadhqhiz.supabase.co";
const SB_KEY = "sb_publishable_N-aZnP5Sdvuk5bjsNKE3mw_2dmnqgd2";   // 公開用のキー（ページに置いてよい種類）
const syncReady = () => !!(SB_URL && SB_KEY);
const CODE_ABC = "23456789ABCDEFGHJKLMNPQRSTUVWXYZ";
function newCode(){ const b = crypto.getRandomValues(new Uint8Array(8)); const c = [...b].map(v => CODE_ABC[v % 32]).join(""); return c.slice(0,4) + "-" + c.slice(4); }
const normCode = c => String(c||"").toUpperCase().replace(/[^0-9A-Z]/g, "").replace(/O/g, "0").replace(/I/g, "1");
async function codeId(code){ const d = await crypto.subtle.digest("SHA-256", new TextEncoder().encode("focus-vocab:" + normCode(code))); return [...new Uint8Array(d)].map(b => b.toString(16).padStart(2, "0")).join(""); }
async function sbRpc(fn, body, keepalive){
  const r = await fetch(`${SB_URL}/rest/v1/rpc/${fn}`, { method: "POST", keepalive: !!keepalive, headers: { apikey: SB_KEY, "Content-Type": "application/json" }, body: JSON.stringify(body) });
  if(!r.ok) throw new Error("sync " + r.status);
  const tx = await r.text(); return tx ? JSON.parse(tx) : null;
}
function payload(){ const meta = Object.assign({}, S.meta); delete meta.session; delete meta.sync; return { v: 1, cards: S.cards, meta }; }
function mergeData(remote){
  if(!remote || !remote.cards) return;
  const rm = remote.meta || {};
  const del = Object.assign({}, rm.deleted || {}, S.meta.deleted || {});
  Object.keys(rm.deleted || {}).forEach(k => { del[k] = Math.max(rm.deleted[k] || 0, (S.meta.deleted || {})[k] || 0); });
  const ids = new Set([...Object.keys(S.cards), ...Object.keys(remote.cards)]);
  const out = {};
  ids.forEach(id => {
    const a = S.cards[id], b = remote.cards[id];
    const ta = a ? (a.u || a.created || 0) : -1, tb = b ? (b.u || b.created || 0) : -1;
    const win = ta >= tb ? a : b, tw = Math.max(ta, tb);
    if(del[id] && del[id] >= tw) return;
    if(win) out[id] = win;
  });
  S.cards = out;
  S.meta.deleted = del;
  S.meta.days = Object.assign({}, rm.days || {}, S.meta.days || {});
  if(rm.pet && (rm.pet.u || 0) > ((S.meta.pet || {}).u || 0)) S.meta.pet = rm.pet;
  // 単語帳: 両方の単語帳を残す（同じ id はこの端末を優先）
  const dk = new Map(); (rm.decks || []).forEach(d => dk.set(d.id, d)); (S.meta.decks || []).forEach(d => dk.set(d.id, d)); if(dk.size) S.meta.decks = [...dk.values()];
  // 設定は新しく変えた方。ただし表示言語・学習言語はこの端末のまま
  if((rm.mu || 0) > (S.meta.mu || 0) && rm.settings){ const keep = { ui: S.meta.settings.ui, lang: S.meta.settings.lang }; S.meta.settings = Object.assign({}, DEFAULT_SETTINGS, rm.settings, keep); }
}
let SYNC_T = null, SYNCING = false, SYNC_AGAIN = false;
function scheduleSync(){ if(!syncReady() || !(S.meta.sync && S.meta.sync.code) || SYNCING) { if(SYNCING) SYNC_AGAIN = true; return; } clearTimeout(SYNC_T); SYNC_T = setTimeout(() => syncNow(), 4000); }
async function syncNow(opts){
  opts = opts || {};
  if(!syncReady() || !(S.meta.sync && S.meta.sync.code)) return false;
  if(SYNCING){ SYNC_AGAIN = true; return false; }
  SYNCING = true; setSyncState("busy");
  try{
    const id = await codeId(S.meta.sync.code);
    const got = await sbRpc("sync_get", { p_id: id });
    if(got && got.data) mergeData(got.data);
    else if(opts.mustExist){ throw new Error("notfound"); }
    try{ localStorage.setItem(LS_KEY, JSON.stringify(S)); }catch(e){}
    await sbRpc("sync_put", { p_id: id, p_data: payload() });

    return true;
  }catch(e){ setSyncState(e.message === "notfound" ? "notfound" : "err"); if(e.message === "notfound") throw e; return false; }
  finally{ SYNCING = false; if(SYNC_AGAIN){ SYNC_AGAIN = false; scheduleSync(); } }
}

    $("#syncJoin").onclick = async () => {

  }
