<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex"><title>암기냥이 시안</title>
<style>
:root{--bg:#69a795;--ink:#0b1a16;--muted:#3d524b;--glass:rgba(244,250,247,.6)}
body{margin:0;background:var(--bg);font-family:"Hiragino Sans","Apple SD Gothic Neo","Noto Sans KR",sans-serif;color:var(--ink)}
main{max-width:980px;margin:0 auto;padding:20px 16px 60px}
h1{font-size:1rem;letter-spacing:.3em;margin:6px 0 2px} p.lead{color:var(--muted);margin:0 0 18px;font-size:.9rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
figure{margin:0;background:var(--glass);border:1px solid rgba(255,255,255,.6);border-radius:28px;padding:16px;-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);box-shadow:0 8px 24px rgba(6,30,24,.12)}
.pic{display:flex;align-items:flex-end;justify-content:center;gap:12px;height:170px}
.pic img{width:150px;height:150px} .pic img.sm{width:56px;height:56px}
figcaption{display:flex;flex-direction:column;gap:3px;margin-top:6px} figcaption b{font-size:1rem} figcaption span{font-size:.85rem;color:var(--muted);line-height:1.5}
</style></head><body><main><h1>암기냥이 · 시안</h1><p class="lead">큰 그림과 실제 크기(56px)를 함께 보여줍니다. 마음에 드는 알파벳을 알려주세요. 섞어도 돼요 (예: B 몸 + D 눈).</p><div class="grid"><figure><div class="pic"><img src="var/J_mix.svg" alt=""><img class="sm" src="var/J_mix.svg" alt=""></div><figcaption><b>J · F + 처음 암기냥이 (지금 적용)</b><span>녹아내린 몸에 처음 고양이의 귀·눈·수염·스카프·단어 카드.</span></figcaption></figure><figure><div class="pic"><img src="var/A_loaf.svg" alt=""><img class="sm" src="var/A_loaf.svg" alt=""></div><figcaption><b>A · 식빵 고양이</b><span>옆으로 길게 엎드린 빵 덩어리. 무표정한 일자 눈.</span></figcaption></figure><figure><div class="pic"><img src="var/B_egg.svg" alt=""><img class="sm" src="var/B_egg.svg" alt=""></div><figcaption><b>B · 달걀형</b><span>세로로 긴 몸에 짝짝이 왕눈. 초점 없이 멍—.</span></figcaption></figure><figure><div class="pic"><img src="var/C_plush.svg" alt=""><img class="sm" src="var/C_plush.svg" alt=""></div><figcaption><b>C · 인형</b><span>펠트 천·바느질 테두리, 십자 수놓은 눈과 단추 코.</span></figcaption></figure><figure><div class="pic"><img src="var/D_busa.svg" alt=""><img class="sm" src="var/D_busa.svg" alt=""></div><figcaption><b>D · 못난이 귀요미</b><span>넓적한 얼굴, 처진 눈과 속눈썹, 커다란 까만 코.</span></figcaption></figure><figure><div class="pic"><img src="var/E_black.svg" alt=""><img class="sm" src="var/E_black.svg" alt=""></div><figcaption><b>E · 검은 고양이</b><span>새까만 몸에 하얀 눈만. (・_・)</span></figcaption></figure><figure><div class="pic"><img src="var/F_melt.svg" alt=""><img class="sm" src="var/F_melt.svg" alt=""></div><figcaption><b>F · 녹아내린 고양이</b><span>바닥에 흐물흐물 퍼진 액체 고양이.</span></figcaption></figure><figure><div class="pic"><img src="var/G_tofu.svg" alt=""><img class="sm" src="var/G_tofu.svg" alt=""></div><figcaption><b>G · 두부 고양이</b><span>네모난 상자 몸. 표정은 최소한.</span></figcaption></figure><figure><div class="pic"><img src="var/H_ball.svg" alt=""><img class="sm" src="var/H_ball.svg" alt=""></div><figcaption><b>H · 동그리</b><span>얼굴만 있는 큰 공. 한쪽 눈 감고 시치미.</span></figcaption></figure><figure><div class="pic"><img src="var/I_mochi.svg" alt=""><img class="sm" src="var/I_mochi.svg" alt=""></div><figcaption><b>I · 지금 버전(모찌)</b><span>말랑한 덩어리 + 멍한 눈. 비교용.</span></figcaption></figure></div></main></body></html>
