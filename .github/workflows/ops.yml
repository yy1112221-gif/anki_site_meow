name: ops-scan
on:
  schedule: [{ cron: "7 */2 * * *" }]   # 2시간마다(:07 UTC) — AI·API 호출 없음, 일감 개수만
  workflow_dispatch: {}
  push: { paths: ["ops/requests.md", "tools/ops_scan.py", ".github/workflows/ops.yml"] }
concurrency: { group: ops-scan, cancel-in-progress: false }
permissions: { contents: write, pull-requests: read }
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/ops_scan.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FB_ADMIN_SECRET: ${{ secrets.FB_ADMIN_SECRET }}
      - run: |
          git config user.name "ops-bot"; git config user.email "ops-bot@users.noreply.github.com"
          git add ops/pending.json && (git diff --cached --quiet || (git commit -m "ops: pending counts" && for i in 1 2 3; do git pull --rebase -X ours && git push && break; sleep 5; done))
